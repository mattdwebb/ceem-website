name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and Astro templates
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Validate routes and assets
        run: node scripts/validate-site.mjs / false https://ceem.ca
